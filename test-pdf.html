<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 2px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .transaction {
            padding: 8px;
            margin: 5px 0;
            background: #f8f9fa;
            border-left: 3px solid #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Upload Test</h1>
        <p>Test the PDF parsing functionality for Trade Republic statements</p>

        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="testPDF()">Parse PDF</button>

        <div id="result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.449/build/pdf.min.mjs" type="module"></script>
    <script type="module">
        import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.449/build/pdf.min.mjs';

        // Set worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.449/build/pdf.worker.min.mjs';

        window.parsePDF = async function(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + ' ';
            }

            // Parse Trade Republic format
            const transactions = [];

            // Month mapping
            const monthMap = {
                'Jan': '01', 'Feb': '02', 'Mär': '03', 'Apr': '04', 'Mai': '05', 'Jun': '06',
                'Jul': '07', 'Aug': '08', 'Sep': '09', 'Okt': '10', 'Nov': '11', 'Dez': '12',
                'Jan.': '01', 'Feb.': '02', 'Mär.': '03', 'Apr.': '04', 'Mai.': '05', 'Jun.': '06',
                'Jul.': '07', 'Aug.': '08', 'Sep.': '09', 'Okt.': '10', 'Nov.': '11', 'Dez.': '12'
            };

            // Match all transactions in the text
            // Format: "DD Mon. YYYY Type Description Amount € Balance €"
            const regex = /(\d{2})\s+(Jan|Feb|Mär|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)\.?\s+(\d{4})\s+(Kartentransaktion|Handel|Zinszahlung|Überweisung|Verkauf|Einzahlung|Auszahlung|Belohnung|Prämie|Erträge|Gebühren)\s+(.+?)\s+([\d.,]+)\s*€\s+([\d.,]+)\s*€/g;

            let match;
            while ((match = regex.exec(fullText)) !== null) {
                const [, day, month, year, type, description, amount, balance] = match;

                const monthNum = monthMap[month] || monthMap[month + '.'];
                const isoDate = `${year}-${monthNum}-${day.padStart(2, '0')}`;

                const amountStr = amount.replace(/\./g, '').replace(',', '.');
                const parsedAmount = Math.abs(parseFloat(amountStr));

                // Clean up description - remove extra whitespace
                const cleanDesc = description.trim().replace(/\s+/g, ' ');

                if (parsedAmount > 0 && cleanDesc.length > 0 && cleanDesc.length < 200) {
                    transactions.push({
                        date: isoDate,
                        description: `${type}: ${cleanDesc}`,
                        amount: parsedAmount.toString()
                    });
                }
            }

            return transactions;
        };

        window.testPDF = async function() {
            const fileInput = document.getElementById('pdfFile');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files || !fileInput.files[0]) {
                resultDiv.innerHTML = '<div class="error">Please select a PDF file</div>';
                return;
            }

            const file = fileInput.files[0];

            if (file.type !== 'application/pdf') {
                resultDiv.innerHTML = '<div class="error">Please select a valid PDF file</div>';
                return;
            }

            try {
                resultDiv.innerHTML = '<div>Parsing PDF...</div>';
                const transactions = await window.parsePDF(file);

                if (transactions.length === 0) {
                    resultDiv.innerHTML = '<div class="error">No transactions found in PDF</div>';
                } else {
                    let html = `<div class="success">
                        <h3>Successfully parsed ${transactions.length} transaction(s)</h3>
                    </div>
                    <h4>Transactions:</h4>`;

                    transactions.forEach((t, i) => {
                        html += `<div class="transaction">
                            <strong>${i + 1}.</strong> ${t.date} | ${t.description} | €${t.amount}
                        </div>`;
                    });

                    resultDiv.innerHTML = html;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error parsing PDF: ${error.message}</div>`;
                console.error('PDF parsing error:', error);
            }
        };
    </script>
</body>
</html>
